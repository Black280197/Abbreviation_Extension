<!DOCTYPE html>
<html lang="vi">
<head>
  <title>Thiết lập Extension</title>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background-color: #f5f5f5;
      color: #333;
    }

    h2 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 30px;
      font-size: 24px;
      font-weight: 600;
    }

    #abbreviations {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    input[type="text"] {
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 4px;
      flex: 1;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #3498db;
      outline: none;
    }

    button#add {
      padding: 10px 20px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s ease;
    }

    button#add:hover {
      background-color: #2980b9;
    }

    ul#list {
      list-style: none;
      padding: 0;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    ul#list li {
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      color: #555;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    ul#list li:last-child {
      border-bottom: none;
    }

    ul#list li:hover {
      background-color: #f9f9f9;
    }

    .actions {
      display: flex;
      gap: 5px;
    }

    .edit-btn, .delete-btn {
      padding: 5px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background-color 0.3s ease;
    }

    .edit-btn {
      background-color: #f1c40f;
      color: white;
    }

    .edit-btn:hover {
      background-color: #d4ac0d;
    }

    .delete-btn {
      background-color: #e74c3c;
      color: white;
    }

    .delete-btn:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>
  <h2>Thiết lập từ viết tắt</h2>
  <div id="abbreviations">
    <input type="text" id="short" placeholder="Từ viết tắt">
    <input type="text" id="full" placeholder="Nội dung đầy đủ">
    <button id="add">Thêm</button>
  </div>
  <ul id="list"></ul>

  <script src="options.js"></script>
</body>
</html>
